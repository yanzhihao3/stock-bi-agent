# ============================================================
# Stock BI Agent —— 单容器部署
#
# 为什么是一个 service 而不是三个？
#   项目里有三处硬编码了"同机"地址：
#     services/chat.py        → http://localhost:8900/sse   （后端调 MCP）
#     demo/common.py 等 13 处 → http://127.0.0.1:8000        （前端调后端）
#   所以这三个进程必须待在同一个网络命名空间里，一个容器最省事。
#   将来想拆成三个 service，得先把上面这些地址改成读环境变量。
#
# 常用命令：
#   docker compose up -d --build   构建并后台启动
#   docker compose logs -f         实时看日志
#   docker compose ps              看状态与健康检查结果
#   docker compose down            停止并删除容器（数据保留在 ./assert）
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: stock-bi-agent:latest
    container_name: stock-bi-agent

    # 容器意外退出后自动拉起；只有你手动 stop 才不重启
    restart: unless-stopped

    # 只把 Streamlit 暴露给宿主机。
    # 8000（FastAPI）和 8900（MCP）故意不映射 —— 它们只在容器内部互相调用，
    # 映射出去等于把后端接口和 MCP 工具直接挂到公网上。
    ports:
      - "8501:8501"

    # 所有密钥从 .env 注入，而 .env 已被 .dockerignore 挡在镜像之外
    env_file:
      - .env

    environment:
      TZ: Asia/Shanghai

    # SQLite 持久化：容器内 /app/assert ↔ 宿主机 ./assert
    # 这样重新 build、删除容器都不会丢用户数据和对话记录
    volumes:
      - ./assert:/app/assert

    # 三个进程并行跑，最后用 exec 让 Streamlit 顶替 shell 成为容器主进程。
    # 这样容器生命周期 = Streamlit 生命周期，docker stop 也能正确转发信号。
    #
    # 注意这里必须用「列表 + | 块」写法，不能用 > 折叠写法：
    # YAML 的 > 只在各行缩进相同（或后续行缩进更浅）时才折叠成一行，
    # 而流的续行通常缩进更深，会被原样保留成真实换行，
    # 导致 --server.port 这些参数被 shell 当成独立命令，Streamlit 拿不到参数、
    # 退回只监听 127.0.0.1，宿主机就访问不到 8501。
    command:
      - sh
      - -c
      - |
        python main_server.py &
        python main_mcp.py &
        exec streamlit run demo/streamlit_demo.py --server.port 8501 --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false

    # 健康检查：三个端口都活着才算健康。
    # 8000 发一次真实 HTTP 请求；8900/8501 探测 TCP 是否可连。
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket,urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/healthy',timeout=3); socket.create_connection(('127.0.0.1',8900),3).close(); socket.create_connection(('127.0.0.1',8501),3).close()\""]
      interval: 30s
      timeout: 15s
      retries: 3
      # 首次启动要给 MCP 聚合器收集工具列表、Streamlit 初始化留出时间
      start_period: 60s
