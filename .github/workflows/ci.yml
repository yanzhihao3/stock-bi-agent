name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest

      # ⚠️ 必须在跑测试之前建表：models/orm.py 里**不再有** create_all 了，
      # 表结构由 Alembic 管。这里跑一次 upgrade 顺便验证迁移能在**空库**上跑通
      # （CI 里没有 .env，所以走默认的 SQLite）。
      #
      # ⚠️ alembic 必须在 requirements.txt 里。本机可能早就手动装过，只有干净环境
      # 才暴露 —— 漏装时这步的报错是：
      #   No module named alembic.__main__; 'alembic' is a package and cannot be directly executed
      # 那句里的"包"指的是仓库根目录的 alembic/（迁移脚本目录），不是真包。
      - name: Apply migrations
        run: python -m alembic upgrade head
        env:
          JWT_SECRET: ci-only-fake-secret-0123456789abcdef0123456789abcdef
          TIMESTAMP_SECRET: ci-only-fake-secret-0123456789abcdef0123456789abcdef

      - name: Run unit tests
        run: python -m pytest test/test_schema_normalizer.py test/test_redis_client.py test/test_auth.py test/test_chat_common.py test/test_jinja2_template.py test/test_errors.py test/test_check_numbers.py test/test_observability.py test/test_tool_output.py test/test_report.py test/test_memory_parse.py test/test_db_limits.py -v
        env:
          # JWT_SECRET / TIMESTAMP_SECRET 在代码里是必填项（未设置会直接报错）。
          # 这里给测试用的假值，仅为让 CI 能跑起来，不要用于任何真实环境。
          JWT_SECRET: ci-only-fake-secret-0123456789abcdef0123456789abcdef
          TIMESTAMP_SECRET: ci-only-fake-secret-0123456789abcdef0123456789abcdef

  docker:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: stock-bi-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
