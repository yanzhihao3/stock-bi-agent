# 工具选择评测集（黄金问题集）
#
# 用法：python eval/run_eval.py --engine agents
#
# 字段说明
#   id           条目标识，报告里按它列失败明细
#   category     类别，用于分类统计（先看哪一类最差）
#   question     发给模型的问题
#   setup        可选，多轮场景的前置对话（同一会话内先发这些，再发 question）
#   expect_tools 必须被调用的工具（漏调 = 错）
#   optional_tools 调了算对、不调也不算错（给模型留合理的替代解法）
#   forbid_tools 不能被调用的工具。三种写法：
#                 · [__any__]  特殊标记：一个工具都不许调（用于闲聊/边界类）
#                 · [stock_*]  通配符：所有 stock_ 开头的工具都不许调
#                 · 注意：它只约束「多调」的那些工具，
#                   不会误伤 expect_tools 里期望调用的（这是之前修过的一个 bug）
#   note         为什么这么出题，方便以后维护
#
# 出题原则
#   1. 只写工具集合，不写调用顺序 —— 先查代码还是先查行情不该算错
#   2. 区分"必须调"和"可选"，避免把合理但不同的解法判为错误
#   3. 重点覆盖最容易混的工具组：新闻五兄弟、K 线三兄弟

- id: chat-01
  category: 闲聊
  question: 你好呀
  expect_tools: []
  forbid_tools: [__any__]
  note: 打招呼不该触发任何工具，这是最容易被模型做错的一类

- id: chat-02
  category: 闲聊
  question: 帮我写一首关于春天的小诗
  expect_tools: []
  forbid_tools: [__any__]
  note: 纯生成任务不需要任何工具

- id: tool-01
  category: 单工具
  question: 上海今天天气怎么样
  expect_tools: [get_city_weather]
  note: 唯一正确答案，用来验证最基本的工具选择

- id: tool-02
  category: 单工具
  question: 100 美元能换多少人民币
  expect_tools: [get_rate_transform]
  note: 汇率换算，货币要用三位代码

- id: news-01
  category: 易混淆
  question: 今天有什么新闻
  expect_tools: [get_today_daily_news]
  forbid_tools: [get_douyin_hot_news, get_toutiao_hot_news, get_github_hot_news]
  note: 新闻类 5 个工具最容易混；泛问"新闻/要闻"应优先每日简报

- id: news-02
  category: 易混淆
  question: 最近有什么火的开源项目
  expect_tools: [get_github_hot_news]
  forbid_tools: [get_today_daily_news, get_douyin_hot_news]
  note: 技术类热点应该走 GitHub 热榜，不是综合新闻

- id: stock-01
  category: 多工具
  question: 贵州茅台最近的走势怎么样
  expect_tools: [stock_get_codes]
  optional_tools: [stock_get_kline, stock_get_info, stock_get_minute_data]
  note: 必须先把"贵州茅台"转成代码；日K/周K 都算合理

- id: stock-02
  category: 易混淆
  question: 贵州茅台这家公司基本面怎么样
  expect_tools: [stock_get_codes]
  optional_tools: [stock_get_info]
  forbid_tools: [stock_get_kline]
  note: 基本面问的是公司资料，不是 K 线；考察能否区分"信息"和"行情"

- id: stock-03
  category: 易混淆
  question: 今天大盘怎么样
  expect_tools: [stock_get_board_info]
  optional_tools: [stock_get_index_code, stock_get_industry_code]
  forbid_tools: [stock_get_kline]
  note: 大盘概况 vs 板块排名 vs 指数列表，三个工具语义接近

- id: mix-01
  category: 跨类组合
  question: 贵州茅台今天涨了吗？顺便说下上海热不热
  expect_tools: [stock_get_codes, get_city_weather]
  optional_tools: [stock_get_kline, stock_get_info, stock_get_minute_data]
  note: 股票 + 天气混合，考察能否在一次回答里选到跨类工具

- id: memory-01
  category: 记忆
  question: 我刚才问的是哪只股票
  setup:
    - 贵州茅台最近的走势怎么样
  expect_tools: []
  forbid_tools: [__any__]
  note: 答案应该来自上文记忆而不是工具；考察多轮上下文与长期记忆是否生效

# ---------------------------------------------------------------
# 以下用例专门用来制造"干扰"：要么问题模糊，要么句子里埋了
# 容易误触发工具的线索。前面那批容易满分，这批才是区分度所在。
# ---------------------------------------------------------------

- id: amb-01
  category: 易混淆
  tags: [难题]
  question: 最近有什么消息
  expect_tools: [get_today_daily_news]
  optional_tools: [get_toutiao_hot_news]
  forbid_tools: [stock_*]
  note: 没给上下文时按通用新闻理解；但绝不能去查股票——歧义句最容易触发这类误判

- id: disturb-01
  category: 干扰
  tags: [难题]
  question: 介绍一下上海这个城市
  expect_tools: []
  forbid_tools: [get_city_weather]
  note: 句子里有"上海"，极易误触发天气工具；这里问的是城市介绍，凭已有知识回答即可

- id: calc-01
  category: 边界
  tags: [难题]
  question: 100 除以 3 等于多少
  expect_tools: []
  forbid_tools: [__any__]
  note: 纯计算，模型自己能算；调用任何工具都是错的

- id: chat-03
  category: 闲聊
  tags: [难题]
  question: 你觉得人生的意义是什么
  expect_tools: []
  forbid_tools: [__any__]
  note: 开放性闲聊容易诱发"名言鸡汤"类工具误触发

- id: stock-04
  category: 易混淆
  tags: [难题]
  question: 贵州茅台这三年的走势怎么样
  expect_tools: [stock_get_codes]
  optional_tools: [stock_get_kline, stock_get_info]
  forbid_tools: [stock_get_minute_data]
  note: >
    K 线工具已合并为 stock_get_kline(code, period)，所以这条不再检查粒度对错
    （工具名里已经看不出 day/week/month 了）。
    改进效果改由「调用次数 + token」观察：合并前实测一轮调了 6 次工具、23,270 token，
    其中日K 三年会拉回上千条数据，是 token 暴涨的主因。
    stock_get_info（公司资料）作为背景补充属于合理行为，故放进 optional。

- id: mix-02
  category: 跨类组合
  tags: [难题]
  question: 今天有什么新闻，另外茅台涨了吗
  expect_tools: [get_today_daily_news, stock_get_codes]
  optional_tools: [stock_get_kline, stock_get_info, stock_get_minute_data]
  forbid_tools: [get_douyin_hot_news, get_github_hot_news]
  note: 新闻 + 股票混合；考察会不会把新闻类工具用到个股上，或者反过来漏掉一类
